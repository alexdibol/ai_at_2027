[build-system]
requires=["setuptools>=68","wheel"]
build-backend="setuptools.build_meta"

[project]
name="aiat-governor"
version="0.2.0"
description="Governed AIAT research-to-QuantConnect agent."
readme="README.md"
requires-python=">=3.10"
dependencies=["pydantic>=2.6"]

[project.scripts]
aiat="aiat_governor.cli:main"

[tool.setuptools.packages.find]
where=["."]
include=["aiat_governor*"]
